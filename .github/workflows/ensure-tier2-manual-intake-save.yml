name: Ensure Tier 2 manual intake save stays visible

on:
  push:
    paths:
      - '.github/workflows/ensure-tier2-manual-intake-save.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Keep manual intake save independent from plan visibility
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/consignment_intake.jsx')
          text = path.read_text()

          old_signature = """function ManualItemCore({
  form,
  setForm,
  onSave,
  saveLabel = 'Save manual item',
  saveDisabled = false,
  helperText = 'Saves only the consignment metaobject record. No Shopify product is created.',
}) {"""
          new_signature = """function ManualItemCore({
  form,
  setForm,
  onSave,
  saveLabel = 'Save manual item',
  saveDisabled = false,
  forceSaveVisible = false,
  helperText = 'Saves only the consignment metaobject record. No Shopify product is created.',
}) {"""

          if old_signature not in text:
              raise SystemExit('ManualItemCore signature not found')
          text = text.replace(old_signature, new_signature, 1)

          old_action = """      <div
        className=\"consignment-form-actions-inner\"
        style={{ marginBottom: 14 }}
      >
        <button
          className=\"consignment-btn\"
          disabled={saveDisabled}
          onClick={onSave}
        >"""
          new_action = """      <div
        className=\"consignment-form-actions-inner\"
        style={{
          marginBottom: 14,
          ...(forceSaveVisible
            ? { display: 'flex', visibility: 'visible', opacity: 1 }
            : {}),
        }}
        data-manual-save-action={forceSaveVisible ? 'forced-visible' : 'standard'}
      >
        <button
          className=\"consignment-btn\"
          disabled={saveDisabled}
          onClick={onSave}
        >"""

          if old_action not in text:
              raise SystemExit('Manual save action block not found')
          text = text.replace(old_action, new_action, 1)

          old_intake = """              <ManualItemCore
                form={form}
                setForm={setForm}
                onSave={() => onSaveBatch([form])}
                saveDisabled={!canSave}
                saveLabel=\"Save manual item\"
              />"""
          new_intake = """              <ManualItemCore
                form={form}
                setForm={setForm}
                onSave={() => onSaveBatch([form])}
                saveDisabled={!canSave}
                saveLabel=\"Save manual item\"
                forceSaveVisible={tier2Enabled}
              />"""

          if old_intake not in text:
              raise SystemExit('Intake ManualItemCore block not found')
          text = text.replace(old_intake, new_intake, 1)

          path.write_text(text)
          Path('.github/workflows/ensure-tier2-manual-intake-save.yml').unlink(missing_ok=True)
          PY

      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep Tier 2 manual intake save visible"
          git push origin main
