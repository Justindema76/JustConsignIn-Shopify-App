name: One-time payout layout fix

on:
  push:
    paths:
      - '.github/workflows/one-time-payout-layout-fix.yml'

permissions:
  contents: write

jobs:
  patch-payout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch payout page
        shell: python
        run: |
          from pathlib import Path

          intake = Path('app/consignment_intake.jsx')
          text = intake.read_text()
          start = text.index('function CreatePayoutScreen(')
          end = text.index('/* ---------- screens ---------- */', start)

          replacement = r'''function formatPayoutSoldDate(value) {
            if (!value) return '—';
            const date = new Date(String(value).includes('T') ? value : `${value}T00:00:00`);
            if (Number.isNaN(date.getTime())) return String(value);
            return date.toLocaleDateString('en-CA', {
              year: 'numeric',
              month: 'short',
              day: 'numeric',
            });
          }

          function CreatePayoutScreen({ consignor, items, onBack, onRecordPayout }) {
            const eligible = items.filter(
              (item) =>
                item.consignorId === consignor.id &&
                (item.status === 'Sold' || item.dateSold) &&
                !item.paidOut,
            );

            const [selectedIds, setSelectedIds] = useState(() =>
              eligible.map((item) => item.id),
            );
            const [adjustment, setAdjustment] = useState('');
            const [note, setNote] = useState('');
            const [method, setMethod] = useState('E-transfer');
            const [reference, setReference] = useState('');
            const [payoutDate, setPayoutDate] = useState(
              new Date().toISOString().slice(0, 10),
            );
            const [saving, setSaving] = useState(false);

            const selected = eligible.filter((item) =>
              selectedIds.includes(item.id),
            );

            const itemTotal = selected.reduce((sum, item) => {
              const salePrice = Number(item.salePrice ?? item.price ?? 0);
              const commissionRate = Number(
                item.commissionPct ?? consignor.commissionPct ?? 0,
              );

              return sum + (salePrice * commissionRate) / 100;
            }, 0);

            const payoutTotal = itemTotal + Number(adjustment || 0);

            function toggleItem(id) {
              setSelectedIds((current) =>
                current.includes(id)
                  ? current.filter((entry) => entry !== id)
                  : [...current, id],
              );
            }

            async function recordPayout() {
              setSaving(true);

              try {
                await onRecordPayout({
                  consignorId: consignor.id,
                  itemIds: selectedIds,
                  adjustment: Number(adjustment || 0),
                  payoutDate,
                  method,
                  reference,
                  note,
                });
              } finally {
                setSaving(false);
              }
            }

            return (
              <>
                <Header
                  eyebrow={`Consignor #${consignor.number}`}
                  title="Create payout"
                  onBack={onBack}
                />

                <div className="consignment-body">
                  <div className="consignment-form-shell consignment-payout-shell">
                    <section className="consignment-form-section consignment-payout-card">
                      <div className="consignment-payout-summary-grid">
                        <div className="consignment-payout-summary-cell">
                          <span className="consignment-label">Consignor</span>
                          <strong>
                            {consignor.firstName} {consignor.lastName}
                          </strong>
                          <small>Default commission: {consignor.commissionPct}%</small>
                        </div>

                        <div className="consignment-payout-summary-cell">
                          <span className="consignment-label">Selected sales</span>
                          <strong>{selected.length}</strong>
                          <small>Consignor earnings: {money(itemTotal)}</small>
                        </div>

                        <div className="consignment-payout-summary-cell">
                          <span className="consignment-label">Amount due</span>
                          <strong className="consignment-payout-total-value">
                            {money(payoutTotal)}
                          </strong>
                          <small>Includes manual adjustment</small>
                        </div>
                      </div>

                      <div className="consignment-payout-section">
                        <div className="consignment-payout-section-head">
                          <div>
                            <h2>Items in this payout</h2>
                            <p>Select the eligible sold items to include.</p>
                          </div>

                          <button
                            type="button"
                            className="consignment-link-button"
                            onClick={() =>
                              setSelectedIds(
                                selectedIds.length === eligible.length
                                  ? []
                                  : eligible.map((item) => item.id),
                              )
                            }
                          >
                            {selectedIds.length === eligible.length
                              ? 'Exclude all'
                              : 'Select all'}
                          </button>
                        </div>

                        <div className="consignment-payout-items">
                          {eligible.length === 0 && (
                            <div className="consignment-empty-small">
                              This consignor has no eligible unpaid sales.
                            </div>
                          )}

                          {eligible.map((item) => {
                            const salePrice = Number(item.salePrice ?? item.price ?? 0);
                            const rate = Number(
                              item.commissionPct ?? consignor.commissionPct ?? 0,
                            );
                            const due = (salePrice * rate) / 100;

                            return (
                              <label key={item.id} className="consignment-payout-item-row">
                                <input
                                  type="checkbox"
                                  checked={selectedIds.includes(item.id)}
                                  onChange={() => toggleItem(item.id)}
                                />

                                <span className="consignment-payout-item-main">
                                  <strong>{item.description || item.itemNumber}</strong>
                                  <span>
                                    {item.orderName || item.itemNumber} · Sale {money(salePrice)} · Sold {formatPayoutSoldDate(item.dateSold)}
                                  </span>
                                </span>

                                <span className="consignment-payout-item-rate">
                                  <span className="consignment-label">Rate</span>
                                  <strong>{rate}%</strong>
                                </span>

                                <strong className="consignment-payout-item-due">
                                  {money(due)}
                                </strong>
                              </label>
                            );
                          })}
                        </div>
                      </div>

                      <div className="consignment-payout-section">
                        <div className="consignment-payout-section-head">
                          <div>
                            <h2>Payment details</h2>
                            <p>Record how and when the consignor is being paid.</p>
                          </div>
                        </div>

                        <div className="consignment-form-grid consignment-form-grid-3 consignment-payout-payment-grid">
                          <div className="consignment-form-field">
                            <label className="consignment-label">Payment method</label>
                            <select
                              className="consignment-select"
                              value={method}
                              onChange={(event) => setMethod(event.target.value)}
                            >
                              <option>E-transfer</option>
                              <option>Cash</option>
                              <option>Cheque</option>
                              <option>Store credit</option>
                              <option>Other</option>
                            </select>
                          </div>

                          <div className="consignment-form-field">
                            <label className="consignment-label">Payout date</label>
                            <input
                              className="consignment-input"
                              type="date"
                              value={payoutDate}
                              onChange={(event) => setPayoutDate(event.target.value)}
                            />
                          </div>

                          <div className="consignment-form-field">
                            <label className="consignment-label">Reference</label>
                            <input
                              className="consignment-input"
                              value={reference}
                              onChange={(event) => setReference(event.target.value)}
                              placeholder={
                                method === 'Store credit'
                                  ? 'Credit memo or note'
                                  : 'Optional confirmation #'
                              }
                            />
                          </div>

                          <div className="consignment-form-field">
                            <label className="consignment-label">Manual adjustment</label>
                            <input
                              className="consignment-input"
                              type="number"
                              inputMode="decimal"
                              value={adjustment}
                              onChange={(event) => setAdjustment(event.target.value)}
                              placeholder="0.00"
                            />
                          </div>

                          <div className="consignment-form-field consignment-payout-note-field">
                            <label className="consignment-label">Payout note</label>
                            <input
                              className="consignment-input"
                              value={note}
                              onChange={(event) => setNote(event.target.value)}
                              placeholder="Optional payment reference or note"
                            />
                          </div>
                        </div>

                        {method === 'Store credit' && (
                          <div className="consignment-form-help consignment-payout-store-credit-help">
                            <CircleDollarSign size={17} />
                            This records the amount as store credit in the payout ledger
                            and on each linked Shopify product.
                          </div>
                        )}
                      </div>

                      <div className="consignment-payout-footer">
                        <div>
                          <span className="consignment-label">Total payout</span>
                          <strong>{money(payoutTotal)}</strong>
                        </div>

                        <button
                          type="button"
                          className="consignment-btn"
                          disabled={!selected.length || saving}
                          onClick={recordPayout}
                        >
                          <WalletCards size={17} />
                          {saving ? 'Recording payout…' : 'Record payout'}
                        </button>
                      </div>
                    </section>
                  </div>
                </div>
              </>
            );
          }

          '''

          intake.write_text(text[:start] + replacement + text[end:])

          css = Path('app/styles/consignment-forms.css')
          css_text = css.read_text()
          marker = '/* COMPACT CREATE PAYOUT */'
          if marker not in css_text:
              css_text += r'''

          /* COMPACT CREATE PAYOUT */
          .consignment-payout-shell {
            max-width: 1100px;
          }

          .consignment-payout-card {
            overflow: hidden;
          }

          .consignment-payout-summary-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            background: var(--surface-subtle);
            border-bottom: 1px solid var(--line);
          }

          .consignment-payout-summary-cell {
            min-width: 0;
            padding: 14px 16px;
            border-right: 1px solid var(--line);
          }

          .consignment-payout-summary-cell:last-child {
            border-right: 0;
          }

          .consignment-payout-summary-cell > strong {
            display: block;
            margin-top: 3px;
            font-size: 17px;
          }

          .consignment-payout-summary-cell small {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 11px;
          }

          .consignment-payout-total-value {
            color: var(--green-dark);
            font-size: 20px !important;
          }

          .consignment-payout-section {
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
          }

          .consignment-payout-section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 10px;
          }

          .consignment-payout-section-head h2 {
            margin: 0;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .04em;
            text-transform: uppercase;
          }

          .consignment-payout-section-head p {
            margin: 2px 0 0;
            color: var(--muted);
            font-size: 11px;
          }

          .consignment-payout-items {
            display: grid;
            gap: 8px;
          }

          .consignment-payout-item-row {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) 72px 88px;
            gap: 12px;
            align-items: center;
            min-width: 0;
            padding: 10px 12px;
            border: 1px solid var(--line);
            background: var(--surface-subtle);
            cursor: pointer;
          }

          .consignment-payout-item-main {
            min-width: 0;
          }

          .consignment-payout-item-main > strong,
          .consignment-payout-item-main > span {
            display: block;
          }

          .consignment-payout-item-main > strong {
            overflow: hidden;
            font-size: 13px;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .consignment-payout-item-main > span {
            margin-top: 2px;
            color: var(--muted);
            font-size: 11px;
          }

          .consignment-payout-item-rate {
            text-align: left;
          }

          .consignment-payout-item-rate > strong {
            display: block;
            margin-top: 2px;
          }

          .consignment-payout-item-due {
            text-align: right;
            font-size: 15px;
          }

          .consignment-payout-payment-grid {
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
          }

          .consignment-payout-payment-grid .consignment-form-field {
            margin-bottom: 0;
          }

          .consignment-payout-note-field {
            grid-column: span 2;
          }

          .consignment-payout-store-credit-help {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 10px;
          }

          .consignment-payout-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 13px 16px;
            background: var(--surface-subtle);
          }

          .consignment-payout-footer > div > strong {
            display: block;
            margin-top: 2px;
            font-size: 22px;
          }

          @media (max-width: 760px) {
            .consignment-payout-summary-grid {
              grid-template-columns: 1fr;
            }

            .consignment-payout-summary-cell {
              padding: 12px 14px;
              border-right: 0;
              border-bottom: 1px solid var(--line);
            }

            .consignment-payout-summary-cell:last-child {
              border-bottom: 0;
            }

            .consignment-payout-section {
              padding: 12px 14px;
            }

            .consignment-payout-item-row {
              grid-template-columns: auto minmax(0, 1fr) auto;
              gap: 9px;
              padding: 10px;
            }

            .consignment-payout-item-rate {
              display: none;
            }

            .consignment-payout-item-main > span {
              line-height: 1.35;
              white-space: normal;
            }

            .consignment-payout-payment-grid {
              grid-template-columns: 1fr;
            }

            .consignment-payout-note-field {
              grid-column: auto;
            }

            .consignment-payout-footer {
              align-items: stretch;
              flex-direction: column;
              padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
            }

            .consignment-payout-footer .consignment-btn {
              width: 100%;
            }
          }
          '''
              css.write_text(css_text)

          workflow = Path('.github/workflows/one-time-payout-layout-fix.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit payout fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/consignment_intake.jsx app/styles/consignment-forms.css .github/workflows/one-time-payout-layout-fix.yml
          git commit -m "Compact create payout page and show sold dates"
          git push origin main
