name: Remove SEO autofill once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/remove-seo-autofill-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update intake SEO defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/consignment_intake.jsx")
          text = path.read_text(encoding="utf-8")
          start_marker = "    seoTitle: description,\n    seoDescription: [\n"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("SEO autofill start not found")
          end_marker = ".slice(0, 320),"
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("SEO autofill end not found")
          end = text.find("\n", end) + 1
          replacement = "    seoTitle: '',\n    seoDescription: '',\n"
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
      - name: Commit change
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add app/consignment_intake.jsx
          git commit -m 'Stop auto-populating Shopify SEO fields'
          git push origin main
