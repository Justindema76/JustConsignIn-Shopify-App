name: Category cleanup once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/category-cleanup-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace category choices
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('app/consignment_intake.jsx')
          text = path.read_text()

          replacement = """const CATEGORIES = [
  'Clothing',
  'Shoes',
  'Jewellery',
  'Handbags & Accessories',
  'Baby & Kids',
  'Toys & Games',
  'Bicycles & Cycling',
  'Sporting Goods',
  'Outdoor & Camping',
  'Home Decor',
  'Furniture',
  'Kitchen & Housewares',
  'Electronics',
  'Appliances',
  'Books & Media',
  'Video Games',
  'Collectibles',
  'Tools',
  'Automotive',
  'Pet Supplies',
  'Art',
  'Other',
];"""

          updated, count = re.subn(
              r"const CATEGORIES = \[.*?\];(?=\nconst CONDITIONS)",
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected one CATEGORIES block, found {count}')

          path.write_text(updated)
          PY

      - name: Commit category cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/consignment_intake.jsx
          git commit -m "Improve consignment categories and remove bad encoding"
          git push origin main
